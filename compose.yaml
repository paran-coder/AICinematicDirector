services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinematic_director
      POSTGRES_USER: cinematic
      POSTGRES_PASSWORD: cinematic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinematic -d cinematic_director"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - cinematic_director_pg:/var/lib/postgresql/data

volumes:
  cinematic_director_pg:
